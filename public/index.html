<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 자기 주소만 허용: 외부 스크립트·분석 도구·광고 없음 (vercel.json의 헤더에도 같은 규칙이 있음) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="낱말과 문장을 듣고 따라 말하며 매일 조금씩 연습하는 한글 발음 연습 도구">
<meta name="theme-color" content="#F6EEE3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말하기 짝꿍">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>말하기 짝꿍</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./css/app.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>
<!-- 시작 화면: 로고가 입체적으로 떠오르는 동안 앱을 준비합니다 (app.js의 finishSplash가 닫음) -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-stage">
    <div class="splash-shadow"></div>
    <div class="splash-tile">
      <img src="./icons/logo.svg" alt="" width="220" height="220">
      <span class="splash-shine"></span>
    </div>
  </div>
  <p class="splash-name">말하기 짝꿍</p>
  <p class="splash-sub">듣고 따라 말하는 한글 연습</p>
  <div class="splash-bar"><span></span></div>
</div>
<div id="app"></div>
<noscript><p>말하기 짝꿍을 쓰려면 브라우저의 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
