# 안드로이드 앱(APK) 만들기
# android/ 폴더를 고치거나 Actions 탭에서 'Run workflow'를 누르면 실행됩니다.
# 결과: public/download/malhagi-jjakkung.apk 를 저장소에 넣고,
#       Vercel이 이를 https://malhagi-one.vercel.app/download/malhagi-jjakkung.apk 로 올립니다.
#
# 서명 키
#  - 저장소 Settings → Secrets and variables → Actions 에 ANDROID_KEYSTORE_B64(키 파일을 base64로 바꾼 글자)와
#    ANDROID_KEYSTORE_PASSWORD 가 있으면 그 키로 서명합니다. 같은 키로 만든 APK는 기록을 지우지 않고 '업데이트'로 깔립니다.
#  - 없으면 빌드할 때마다 새 키를 만들고 버립니다. 이때 새 APK는 예전 앱을 지운 뒤에만 설치됩니다(기록도 지워짐).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (unsigned)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "등록된 서명 키를 씁니다."
            echo "$KEYSTORE_B64" | base64 -d > release.p12
            PW="$KEYSTORE_PASSWORD"
          else
            echo "::warning::등록된 서명 키가 없어 이번 빌드만 쓰는 새 키로 서명합니다. 예전 앱을 지운 뒤 설치해야 합니다."
            PW=$(openssl rand -hex 24)
            keytool -genkeypair -keystore release.p12 -storetype PKCS12 -alias malhagi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Malhagi Jjakkung, O=Malhagi, C=KR"
          fi
          ALIAS=$(keytool -list -keystore release.p12 -storetype PKCS12 -storepass "$PW" | awk -F, '/PrivateKeyEntry/{print $1; exit}')
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          mkdir -p public/download
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass "pass:$PW" --ks-key-alias "$ALIAS" \
            --out public/download/malhagi-jjakkung.apk aligned.apk
          "$BT/apksigner" verify --print-certs public/download/malhagi-jjakkung.apk
          rm -f release.p12 aligned.apk public/download/*.idsig
          ls -l public/download

      - name: Commit APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/malhagi-jjakkung.apk
          git commit -m "Android APK build #${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
